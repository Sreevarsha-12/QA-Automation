<!DOCTYPE html>
<html>
<head>
    <title>Register | QA Automation Portal</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(120deg, #2980b9, #6dd5fa);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: white;
            padding: 30px;
            width: 360px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }
        button {
            background: #2980b9;
            color: white;
            border: none;
            cursor: pointer;
        }
        .message {
            margin-top: 15px;
            color: green;
        }
        a {
            display: block;
            margin-top: 15px;
            color: #2980b9;
            text-decoration: none;
        }
    </style>
</head>

<body>
<div class="card">
    <h2>Register</h2>

    <form method="POST">
        <input name="username" placeholder="Username" required>
        <input name="email" type="email" placeholder="Email" required>
        <input name="password" type="password" placeholder="Password" required>
        <button type="submit">Register</button>
    </form>

    <div class="message">{{ message }}</div>

    <a href="/">Back to Login</a>
</div>
</body>
</html>
